name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,vision,synthesis]'
      - run: ruff check .
      - run: pytest
      - if: matrix.python-version == '3.12'
        run: |
          python -m playwright install --with-deps chromium
          python -m pm4bench.vision.fonts --output ./test-fonts
          PM4BENCH_TEST_FONTS="$PWD/test-fonts" pytest -q tests/test_browser_synthesis.py
